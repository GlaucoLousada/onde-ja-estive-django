{% extends 'base.html' %}

{% block title %}Editar post | Onde Já Estive{% endblock %}

{% block content %}
<h1>Editar post</h1>
<form action="{% url 'posts:update' post.id %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
        <button type="submit">Salvar</button>
        <a class="button secondary" href="{% url 'posts:detail' post.id %}">Cancelar</a>
    </div>
</form>
{% endblock %}
