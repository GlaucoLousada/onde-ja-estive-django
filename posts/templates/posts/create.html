{% extends 'base.html' %}

{% block title %}Novo post | Onde Já Estive{% endblock %}

{% block content %}
<h1>Novo post</h1>
<form action="{% url 'posts:create' %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
        <button type="submit">Criar</button>
        <a class="button secondary" href="{% url 'posts:index' %}">Cancelar</a>
    </div>
</form>
{% endblock %}
