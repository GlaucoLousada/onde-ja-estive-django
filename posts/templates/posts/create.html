{% extends 'base.html' %}

{% block title %}Novo post | Onde Já Estive{% endblock %}

{% block content %}
<h1>Novo post</h1>
<form action="{% url 'posts:create' %}" method="post">
    {% csrf_token %}
    <p>
        <label for="id_title">Título</label>
        <input type="text" name="title" id="id_title">
    </p>
    <p>
        <label for="id_content">Conteúdo (HTML)</label>
        <textarea name="content" id="id_content"></textarea>
    </p>
    <div class="actions">
        <button type="submit">Criar</button>
        <a class="button secondary" href="{% url 'posts:index' %}">Cancelar</a>
    </div>
</form>
{% endblock %}
