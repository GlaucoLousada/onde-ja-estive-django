{% extends 'base.html' %}

{% block title %}Remover post | Onde Já Estive{% endblock %}

{% block content %}
<h1>Remover post</h1>
<p>Tem certeza de que deseja remover o post <strong>"{{ post.title }}"</strong>? Esta ação não pode ser desfeita.</p>
<form action="{% url 'posts:delete' post.id %}" method="post">
    {% csrf_token %}
    <div class="actions">
        <button type="submit" class="danger">Sim, remover</button>
        <a class="button secondary" href="{% url 'posts:detail' post.id %}">Cancelar</a>
    </div>
</form>
{% endblock %}
